<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcff; }
      #game { display: block; width: 100vw; height: 100vh; }
      #log { position: fixed; left: 8px; bottom: 8px; font: 12px monospace; color: #2a1a2e;
             background: #fffbe8cc; padding: 6px 8px; max-width: 50vw; white-space: pre; pointer-events: none; }
      #stats { position: fixed; left: 8px; top: 8px; font: 13px monospace; color: #2a1a2e;
               background: #fffbe8cc; padding: 6px 8px; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="stats"></div>
    <div id="log"></div>
    <script type="module" src="./player.js"></script>
  </body>
</html>
