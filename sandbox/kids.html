<!doctype html><html><body style="margin:0;overflow:hidden"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildKid } from '/src/characters/buildKid.js';
import { HEROES, PALETTE } from '/src/core/config.js';
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true });
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(PALETTE.sky);
s.add(new THREE.HemisphereLight(0xfff6e0, 0x9cbc34, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(20, 35, 12); s.add(sun);
const g = new THREE.Mesh(new THREE.CircleGeometry(12, 32).rotateX(-Math.PI/2), new THREE.MeshLambertMaterial({ color: PALETTE.grass })); s.add(g);
const cam = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100); cam.position.set(0, 2.2, 6.5); cam.lookAt(0, 0.9, 0);
const kids = ['dot','pip','moose'].map((id, i) => { const k = buildKid(HEROES[id].look); k.root.position.x = (i-1)*1.9; k.root.rotation.y = (i-1)*-0.3; s.add(k.root); return k; });
kids[0].setBlush(true);
let t = 0;
(function loop(){ requestAnimationFrame(loop); t += 1/60;
  kids[0].update(1/60, { speed01: 0, grounded: true, action: null });
  kids[1].update(1/60, { speed01: 0, grounded: true, action: 'attack', actionT: 0.6, combo: 0 });
  kids[2].update(1/60, { speed01: 0.6, grounded: true, action: null });
  r.render(s, cam); })();
</script></body></html>
